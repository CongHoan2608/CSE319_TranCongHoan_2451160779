<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên - DOM & Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý Sinh viên</h1>
        
        <div id="notification" class="notification hidden"></div>

        <div class="header-actions">
            <div class="stats">
                Tổng số SV: <span id="totalStudents">0</span> | 
                Điểm TB lớp: <span id="avgGpa">0.0</span>
            </div>
            <button id="btnOpenModal" class="btn btn-success">Thêm sinh viên</button>
        </div>

        <table id="studentTable">
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp học</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="studentList">
                </tbody>
        </table>
    </div>

    <div id="studentModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm sinh viên mới</h2>
            <form id="studentForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label>Mã sinh viên (*)</label>
                    <input type="text" id="studentId">
                    <span class="error-msg" id="err-studentId"></span>
                </div>
                <div class="form-group">
                    <label>Họ và tên (*)</label>
                    <input type="text" id="fullName">
                    <span class="error-msg" id="err-fullName"></span>
                </div>
                <div class="form-group">
                    <label>Ngày sinh (*)</label>
                    <input type="date" id="dob">
                    <span class="error-msg" id="err-dob"></span>
                </div>
                <div class="form-group">
                    <label>Lớp học</label>
                    <input type="text" id="className">
                </div>
                <div class="form-group">
                    <label>Điểm trung bình (*)</label>
                    <input type="number" id="gpa" step="0.1">
                    <span class="error-msg" id="err-gpa"></span>
                </div>
                <div class="form-group">
                    <label>Email (*)</label>
                    <input type="text" id="email">
                    <span class="error-msg" id="err-email"></span>
                </div>
                
                <div class="modal-actions">
                    <button type="button" id="btnCloseModal" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
