<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <div class="grid-container">
        
        <header class="header">HEADER</header>

        <section class="hero">
            HERO BANNER
            <div class="featured-card">Card nổi bật</div>
        </section>

        <aside class="sidebar">
            <h3>SIDEBAR</h3>
            <label><input type="checkbox"> Filter 1</label><br>
            <label><input type="checkbox"> Filter 2</label>
        </aside>

        <main class="main-content">
            <div class="product-card">Card 1</div>
            <div class="product-card">Card 2</div>
            <div class="product-card">Card 3</div>
            <div class="product-card">Card 4</div>
            <div class="product-card">Card 5</div>
            <div class="product-card">Card 6</div>
        </main>

        <aside class="ads">ADS</aside>

        <footer class="footer">FOOTER</footer>

    </div>

</body>
</html>
