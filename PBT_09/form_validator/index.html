<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="name" placeholder="Tên (2-50 ký tự)">
                <span id="nameIcon" class="icon"></span>
            </div>
            
            <div class="form-group">
                <input type="text" id="email" placeholder="Email">
                <div id="emailError" class="error-msg"></div>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Mật khẩu">
                <div class="strength-meter">
                    <div id="strengthBar" class="bar"></div>
                </div>
            </div>

            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu">
                <div id="confirmError" class="error-msg"></div>
            </div>

            <div class="form-group">
                <input type="text" id="phone" placeholder="Số điện thoại">
            </div>

            <button type="submit" id="submitBtn" disabled>Đăng ký</button>
        </form>
    </div>

    <div id="successModal" class="modal hidden">
        <div class="modal-content">
            <h3>Đăng ký thành công!</h3>
            <pre id="modalData"></pre>
            <button onclick="document.getElementById('successModal').classList.add('hidden')">Đóng</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
