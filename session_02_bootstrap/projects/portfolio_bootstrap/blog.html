<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Công Hoan | Portfolio Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/blog.css">
</head>
<body>
    <main class="container py-5">
        <div class="row g-4"> <div class="col-lg-8">
                
                <div class="row g-0 mb-4"> <div class="col-md-6 blog-item bg-purple">
                        <img src="https://tse3.mm.bing.net/th/id/OIP.8MDGcl20ERm3nyeXbZrCiQHaEo?cb=thfvnext&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Project 1">
                        <div class="overlay"> 
                            <h3 class="overlay-title">E-Commerce Website</h3>
                            <p class="overlay-category">React + Node.js</p>
                        </div>
                    </div>
                    <div class="col-md-6 blog-item bg-red">
                        <img src="https://thfvnext.bing.com/th/id/OIP.wTNM8Ik-Z9CnUyuyY17cBAHaEo?o=7&cb=thfvnextrm=3&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Project 2">
                        <div class="overlay">
                            <h3 class="overlay-title">Personal Blog</h3>
                            <p class="overlay-category">Vue + Firebase</p>
                        </div>
                    </div>
                </div>

                <div class="blog-item mb-5 bg-primary rounded-4" style="background-color: #58cc02 !important;">
                    <img src="https://thfvnext.bing.com/th/id/OIP.SKvKLNMWtAudWlhh__hdUAHaE8?o=7&cb=thfvnextrm=3&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Project 3">
                    <div class="overlay">
                        <h3 class="overlay-title">Admin Dashboard</h3>
                        <p class="overlay-category">HTML + CSS + JS</p>
                    </div>
                </div>

                <div class="card mb-5 border-0 shadow-sm" style="border-radius: 15px;">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <h5 class="fw-bold mb-0">Leave a Comment</h5>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label small fw-bold">Name</label>
                                    <input type="text" class="form-control border-light bg-light" id="name" placeholder="Your Name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label small fw-bold">Email</label>
                                    <input type="email" class="form-control border-light bg-light" id="email" placeholder="Your Email" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="comment" class="form-label small fw-bold">Comment</label>
                                <textarea class="form-control border-light bg-light" id="comment" rows="4" placeholder="Share your thoughts..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill fw-bold">Post Comment</button>
                        </form>
                    </div>
                </div>
            </div> <div class="col-lg-4">
                <div class="sticky-top pt-lg-0 pt-2" style="top: 100px;">
                    
                    <div class="card mb-4 border-0 shadow-sm p-3" style="border-radius: 15px;">
                        <h5 class="fw-bold mb-3">Search</h5>
                        <div class="input-group border-bottom">
                            <input type="text" class="form-control border-0 shadow-none px-0 bg-transparent" placeholder="Tìm bài viết...">
                            <button class="btn btn-link text-dark p-0" type="button"><i class="bi bi-search"></i></button>
                        </div>
                    </div>

                    <div class="card mb-4 border-0 shadow-sm p-3" style="border-radius: 15px;">
                        <h5 class="fw-bold mb-3">Recent Posts</h5>
                        <div class="d-flex align-items-center mb-3">
                            <div style="width: 50px; height: 50px; background: #eee; border-radius: 8px;"></div>
                            <div class="ms-3">
                                <h6 class="mb-0 small fw-bold">UI Trends 2026</h6>
                                <small class="text-muted">15 May</small>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-4 border-0 shadow-sm p-3" style="border-radius: 15px;">
                        <h5 class="fw-bold mb-3">Categories</h5>
                        <ul class="list-unstyled mb-0">
                            <li class="d-flex justify-content-between small text-muted mb-2">Technology <span>(12)</span></li>
                            <li class="d-flex justify-content-between small text-muted">Design <span>(05)</span></li>
                        </ul>
                    </div>

                    <div class="card border-0 shadow-sm p-3" style="border-radius: 15px;">
                        <h5 class="fw-bold mb-3">Tags</h5>
                        <div class="d-flex flex-wrap gap-2">
                            <span class="badge bg-light text-dark border rounded-pill px-3 py-2">#React</span>
                            <span class="badge bg-light text-dark border rounded-pill px-3 py-2">#Gaming</span>
                            <span class="badge bg-light text-dark border rounded-pill px-3 py-2">#TLU</span>
                        </div>
                    </div>

                </div>
            </div> </div> </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
